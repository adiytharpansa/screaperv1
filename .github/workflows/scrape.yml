name: Scrape

# Jalan manual dari tab Actions (bisa dari HP):
# - kosongkan title & anilist_id  -> proses semua isi titles.txt
# - isi title                     -> satu judul itu saja
# - isi anilist_id                -> satu ID AniList itu saja
on:
  workflow_dispatch:
    inputs:
      title:
        description: "Judul anime (opsional)"
        required: false
        type: string
      anilist_id:
        description: "ID AniList (opsional, menang atas title)"
        required: false
        type: string
      trusted:
        description: "Hanya rilis trusted Nyaa"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jalankan scraper
        run: |
          ARGS=""
          if [ "${{ inputs.trusted }}" = "true" ]; then ARGS="$ARGS --trusted"; fi
          if [ -n "${{ inputs.anilist_id }}" ]; then
            python -m src.scraper --id "${{ inputs.anilist_id }}" $ARGS
          elif [ -n "${{ inputs.title }}" ]; then
            python -m src.scraper --title "${{ inputs.title }}" $ARGS
          else
            python -m src.scraper $ARGS
          fi

      - name: Simpan hasil ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan katalog."
          else
            git commit -m "catalog: perbarui hasil scrape"
            git push
          fi
